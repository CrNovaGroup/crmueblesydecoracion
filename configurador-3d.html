<style>
:root{color-scheme:light;--bg:#f3efe8;--sf:#fbfaf7;--sf2:#ffffff;--sf3:#eee9e0;--bd:#ddd6ca;--bd2:#c6bcab;--gold:#8a5a2b;--tx:#2a2622;--txm:#6b645a;--red:#b83a2e;--green:#1f7a52;--r:8px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px 'Syne',sans-serif}
input,select{font-family:inherit}
#tb{position:fixed;top:0;left:0;right:0;height:54px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:100;overflow-x:auto}
.logo{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--gold);text-transform:uppercase;white-space:nowrap;padding-right:6px}
.sp{width:1px;height:22px;background:var(--bd);flex-shrink:0}.tsp{flex:1}
.tg{display:flex;gap:4px;flex-shrink:0}
.tbtn{height:32px;padding:0 12px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap}
.tbtn:hover{background:var(--sf3);border-color:var(--bd2)}
.tbtn:focus-visible,.ni:focus-visible,#fin:focus-visible{outline:2px solid var(--gold)}
.tbtn.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:800}
.tbtn.danger{color:var(--red);border-color:#e3b3ab}
.tbtn.ok{color:var(--green);border-color:#a9d8c2}
#fin{height:32px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);padding:0 8px;font-size:11px}
#sl{position:fixed;left:0;top:54px;bottom:0;width:270px;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;z-index:90}
#sr{position:fixed;right:0;top:54px;bottom:0;width:250px;background:var(--sf);border-left:1px solid var(--bd);overflow-y:auto;z-index:90}
#cw{position:fixed;top:54px;left:270px;right:250px;bottom:0}
canvas{display:block;width:100%;height:100%}
.sec{padding:13px;border-bottom:1px solid var(--bd)}
.slbl{font-size:10px;font-weight:700;color:var(--txm);margin-bottom:10px}
.fr{margin-bottom:9px}.fl{display:block;font-size:10px;color:var(--txm);margin-bottom:3px}
.ni{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:7px 9px;color:var(--tx);font:12px 'DM Mono',monospace}
#warn{font-size:10px;color:#a85d00;min-height:14px;line-height:1.5}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.vb{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:8px;cursor:pointer;text-align:center;color:var(--txm);font-size:11px;font-weight:700}
.vb:hover{color:var(--gold);background:var(--sf3)}
.vb.on{background:var(--gold);color:#fff;border-color:var(--gold)}
#st{font-size:11px;color:var(--green);white-space:nowrap}
.kv{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}.kv b{font:500 12px 'DM Mono',monospace;color:var(--gold)}
#pl div{font:11px 'DM Mono',monospace;color:var(--txm);padding:3px 0;border-bottom:1px solid var(--bd)}
#pl span{color:var(--gold)}
.mb{display:none;position:fixed;inset:0;background:rgba(40,32,24,.5);z-index:200;align-items:center;justify-content:center}
.mb.show{display:flex}
.mc2{background:var(--sf);border:1px solid var(--bd2);border-radius:16px;padding:24px;width:90%;max-width:420px}
.mc2 h3{margin-bottom:14px}
.ma{display:flex;gap:8px;margin-top:16px}.ma button{flex:1;padding:11px;border-radius:var(--r);border:1px solid var(--bd2);background:transparent;color:var(--txm);font-weight:700;cursor:pointer}
.ma .bp{background:var(--gold);border:none;color:#fff}
@media(max-width:960px){
 #sr{display:none}#cw{left:0;right:0;bottom:42vh}
 #sl{top:auto;height:42vh;width:100%;border-right:none;border-top:1px solid var(--bd)}
}
</style>
</head>

</div>
<div id="cw"></div>

  <div class="ma"><button id="cs">Cancelar</button><button class="bp" id="ds">Enviar</button></div></div></div>
 
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","three/examples/jsm/":"https://unpkg.com/three@0.160.0/examples/jsm/","three-mesh-bvh":"https://unpkg.com/three-mesh-bvh@0.7.6/build/index.module.js","three-mesh-bvh/":"https://unpkg.com/three-mesh-bvh@0.7.6/","three-gpu-pathtracer":"https://unpkg.com/three-gpu-pathtracer@0.0.23/build/index.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
 
/* ============================================================
   CR SMART DESIGN v2 — todo en milímetros.
   Para añadir un tipo de mueble propio (antes o después de cargar):
   CRSmartDesign.registerType({
     id:'bano', name:'Mueble de baño', icon:'🛁',
     params:[{k:'w',l:'Ancho (mm)',v:800,min:400,max:2000,step:10}, ...],
     check:p=>'' (opcional: devuelve un texto de aviso),
     build(p){ const f=CRSmartDesign.frame(0,0,0);
       CRSmartDesign.carcass(f,0,p.w,p.h,p.d,{pl:100,dr:2}); }
   });
   Opciones de carcass: pl zócalo, sh [alturas de baldas], dr cajones, dh alto cajón,
   rl [alturas de barras], dn nº de puertas, open sin techo, by elevación, n desplazamiento de fondo.
   ============================================================ */
const T = 15;
const FIN = { Roble: 0xD4BC98, Blanco: 0xEFEDE8, Nogal: 0x7A5538, Grafito: 0x4A4A50 };
const KN = { panel:'Panel', balda:'Balda', puerta:'Puerta', frente:'Frente cajón', cajon:'Cajón', zocalo:'Zócalo', trasera:'Trasera', encimera:'Encimera', barra:'Barra', tirador:'Tirador' };
const SHEET = new Set(['panel','balda','puerta','frente','zocalo','trasera','encimera']);
const TYPES = {};
/* Texturas de madera procedurales (sin imágenes externas) */
function woodTex(base, dark) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0,0,512,512);
  for (let i = 0; i < 260; i++) {
    const y = Math.random()*512; x.strokeStyle = dark; x.globalAlpha = .04 + Math.random()*.09; x.lineWidth = .5 + Math.random()*2.2;
    x.beginPath(); x.moveTo(0, y);
    for (let u = 0; u <= 512; u += 32) x.lineTo(u, y + Math.sin(u*.02 + i)*3 + Math.random()*1.2);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const FINT = { Roble: () => woodTex('#d4bc98','#8a6a3a'), Nogal: () => woodTex('#7a5538','#2c1a0c') }, TEX = {};
const tex = n => (FINT[n] && !TEX[n] && (TEX[n] = FINT[n]()), TEX[n] || null);
function mat(k, col, w, h, d) {
  if (k === 'barra' || k === 'tirador') return new THREE.MeshPhysicalMaterial({ color:0xc9ccd1, metalness:1, roughness:.28 });
  if (k === 'encimera') return new THREE.MeshPhysicalMaterial({ color:0x2d2d33, roughness:.22, clearcoat:.6, clearcoatRoughness:.15 });
  if (k === 'cajon') return new THREE.MeshStandardMaterial({ color:col, roughness:.7 });
  const o = { color:0xffffff, roughness:.5, clearcoat:.15, clearcoatRoughness:.4 }, t = tex(fin);
  if (t) { o.map = t.clone(); o.map.needsUpdate = true; o.map.repeat.set(Math.max(w,h,d)/700, 1); } else o.color = col;
  return new THREE.MeshPhysicalMaterial(o);
}
const $ = id => document.getElementById(id);
let fin = 'Roble', cur = 'armario', P = {}, els = [], sel = null, CM = '', ready = false;
let scene, camera, renderer, orbit, tc, EX = false, HD = false, PT = null, ENV, GR;
const group = new THREE.Group();
 
/* ---------- Primitivas ---------- */
function add(k, x, y, z, w, h, d, a = 0, cyl = false) {
  const col = k==='barra' ? 0x8899AA : k==='encimera' ? 0x2d2d33 : k==='cajon' ? 0xCCB48A : FIN[fin];
  const g = cyl ? new THREE.CylinderGeometry(.006,.006,w/1e3,10).rotateZ(Math.PI/2) : new THREE.BoxGeometry(w/1e3,h/1e3,d/1e3);
  const m = new THREE.Mesh(g, mat(k, col, w, h, d));
  m.position.set(x/1e3, y/1e3, z/1e3); m.rotation.y = a; m.castShadow = m.receiveShadow = true;
  if (!cyl) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color:0x5a4a38, transparent:true, opacity:.18 })));
  group.add(m); els.push({ k, m, s: [w, h, d], b: m.position.clone() });
}
// Marco local: u = a lo largo del tramo, n = fondo (frente en +n), ang = giro del tramo
function frame(ox, oz, ang = 0) {
  let dy = 0, dn = 0; const c = Math.cos(ang), s = Math.sin(ang);
  const pos = (u, n) => [ox + u*c + (n+dn)*s, oz - u*s + (n+dn)*c];
  return {
    off(y, n) { dy = y; dn = n; },
    box(k, u, y, n, w, h, d) { const [x, z] = pos(u, n); add(k, x, y+dy, z, w, h, d, ang); },
    rail(u, y, n, len) { const [x, z] = pos(u, n); add('barra', x, y+dy, z, len, 12, 12, ang, true); }
  };
}
function carcass(f, u, w, h, d, o = {}) {
  f.off(o.by || 0, o.n || 0);
  const pl = o.pl || 0, iw = w - 2*T, cx = u + w/2, ch = h - pl, cy = pl + ch/2;
  f.box('panel', u+T/2, cy, 0, T, ch, d);
  f.box('panel', u+w-T/2, cy, 0, T, ch, d);
  f.box('panel', cx, pl+T/2, 0, iw, T, d);
  if (!o.open) f.box('panel', cx, h-T/2, 0, iw, T, d);
  f.box('trasera', cx, cy, -d/2+1.5, iw, ch, 3);
  if (pl) f.box('zocalo', cx, pl/2, d/2-T-20, w, pl, T);
  (o.sh || []).forEach(y => f.box('balda', cx, y, -5, iw, T, d-10));
  let y = pl + T; const dh = o.dh || 180;
  for (let i = 0; i < (o.dr || 0); i++) {
    f.box('cajon', cx, y+dh/2-5, -10, iw-26, dh-45, d-70);
    f.box('frente', cx, y+dh/2, d/2+9, w-4, dh-4, 18);
    f.box('tirador', cx, y+dh-35, d/2+28, Math.min(160, w*.4), 10, 12); y += dh;
  }
  (o.rl || []).forEach(ry => f.rail(cx, ry, 0, iw-4));
  const n = o.dn || 0;
  for (let i = 0; i < n; i++) {
    const pw = w/n, ym = pl + (h-pl)/2;
    f.box('puerta', u + pw*(i+.5), ym, d/2+9, pw-3, h-pl-4, 18);
    f.box('tirador', n > 1 && i%2 ? u+pw*i+35 : u+pw*(i+1)-35, ym, d/2+28, 12, Math.min(160, (h-pl)*.3), 12);
  }
}
const even = (n, from, to) => [...Array(n)].map((_, j) => from + (to-from)*(j+1)/(n+1));
const doors = mw => Math.max(1, Math.round(mw/450));
 
/* ---------- Registro de tipos ---------- */
function registerType(t) {
  if (!t || !t.id || !Array.isArray(t.params) || typeof t.build !== 'function') { console.error('Tipo no válido', t); return; }
  TYPES[t.id] = t; if (ready) typeButtons();
}
window.CRSmartDesign = { registerType, TYPES, frame, carcass, add, T, even };
 
registerType({ id:'armario', name:'Armario', icon:'🚪',
  params:[
    {k:'w',l:'Ancho (mm)',v:1800,min:400,max:6000,step:50},{k:'h',l:'Alto (mm)',v:2400,min:600,max:3000,step:50},
    {k:'d',l:'Fondo (mm)',v:600,min:250,max:900,step:10},{k:'m',l:'Módulos',v:3,min:1,max:8,step:1},
    {k:'sh',l:'Baldas del módulo central',v:4,min:0,max:10,step:1},{k:'dr',l:'Cajones del último módulo',v:3,min:0,max:6,step:1},
    {k:'rl',l:'Barra de colgar (1 sí / 0 no)',v:1,min:0,max:1,step:1},{k:'dn',l:'Puertas (1 sí / 0 no)',v:1,min:0,max:1,step:1},
    {k:'pl',l:'Zócalo (mm)',v:80,min:0,max:200,step:10}],
  check: p => { const mw = p.w/p.m; return mw<300||mw>1200 ? `Módulos de ${Math.round(mw)} mm: lo recomendable es 300–1200 mm.` : ''; },
  build(p) {
    const f = frame(0,0,0), mw = p.w/p.m, top = p.h-300;
    for (let i = 0; i < p.m; i++) {
      const k = i%3, o = { pl:p.pl, dn:p.dn ? doors(mw) : 0 };
      if (k===0) { o.sh=[top]; if (p.rl) o.rl=[top-50]; }
      else if (k===1) o.sh = even(p.sh, p.pl+T, p.h-T);
      else { o.dr=p.dr; o.sh=[top]; if (p.rl) o.rl=[top-50]; }
      carcass(f, i*mw, mw, p.h, p.d, o);
    }
  }});
 
registerType({ id:'vestidor', name:'Vestidor', icon:'👔',
  params:[
    {k:'f',l:'Forma (1 lineal, 2 en L, 3 en U)',v:2,min:1,max:3,step:1},
    {k:'w',l:'Ancho pared del fondo (mm)',v:2400,min:900,max:6000,step:50},
    {k:'L',l:'Largo de paredes laterales (mm)',v:1800,min:600,max:5000,step:50},
    {k:'h',l:'Alto (mm)',v:2400,min:1800,max:3000,step:50},{k:'d',l:'Fondo de muebles (mm)',v:500,min:300,max:700,step:10},
    {k:'dr',l:'Cajones por cajonera',v:3,min:0,max:6,step:1}],
  check: p => p.f>=3 && p.w < 2*p.d+900 ? 'El ancho no deja paso entre los dos laterales (mínimo recomendado: 900 mm libres).' : '',
  build(p) {
    const run = (f, len) => {
      const n = Math.max(1, Math.round(len/600)), mw = len/n;
      for (let i = 0; i < n; i++) {
        const o = { open:1 }, k = i%3;
        if (k===0) { o.sh=[p.h-200]; o.rl=[p.h-260, 1000]; }
        else if (k===1) o.sh = even(5, T, p.h);
        else { o.dr=p.dr; o.sh=[1200,1600,2000].filter(y => y < p.h-100); }
        carcass(f, i*mw, mw, p.h, p.d, o);
      }
    };
    run(frame(0,0,0), p.w);
    if (p.f>=2) run(frame(p.d/2, p.d/2+p.L, Math.PI/2), p.L);
    if (p.f>=3) run(frame(p.w-p.d/2, p.d/2, -Math.PI/2), p.L);
  }});
 
registerType({ id:'cocina', name:'Cocina integral', icon:'🍳',
  params:[
    {k:'L',l:'Largo de la cocina (mm)',v:3000,min:1200,max:7000,step:50},{k:'h',l:'Alto mueble bajo con encimera (mm)',v:900,min:800,max:1000,step:10},
    {k:'d',l:'Fondo muebles bajos (mm)',v:600,min:450,max:700,step:10},{k:'dr',l:'Cajones por cajonera',v:3,min:1,max:4,step:1},
    {k:'up',l:'Muebles altos (1 sí / 0 no)',v:1,min:0,max:1,step:1},{k:'uh',l:'Alto muebles altos (mm)',v:700,min:400,max:1000,step:50},
    {k:'ud',l:'Fondo muebles altos (mm)',v:330,min:250,max:450,step:10},
    {k:'is',l:'Isla (1 sí / 0 no)',v:0,min:0,max:1,step:1},{k:'il',l:'Largo de isla (mm)',v:1800,min:600,max:4000,step:50}],
  check: p => p.up && p.h+p.uh+550 > 2600 ? 'Los altos quedan por encima de 2,6 m: revisa la altura.' : '',
  build(p) {
    const bh = p.h - 38;
    const run = (f, len, uppers) => {
      const n = Math.max(1, Math.round(len/600)), mw = len/n;
      for (let i = 0; i < n; i++) {
        const dr = i%3 === 1;
        carcass(f, i*mw, mw, bh, p.d, dr ? { pl:100, dr:p.dr, dh:(bh-100-2*T)/p.dr } : { pl:100, sh:[100+(bh-100)/2], dn:doors(mw) });
      }
      f.off(0,0); f.box('encimera', len/2, bh+19, 10, len, 38, p.d+30);
      if (uppers) for (let i = 0; i < n; i++)
        carcass(f, i*mw, mw, p.uh, p.ud, { by:p.h+550, n:p.d/2-p.ud/2, sh:[p.uh/2], dn:doors(mw) });
    };
    run(frame(0,0,0), p.L, p.up);
    if (p.is) run(frame((p.L+p.il)/2, p.d+1000, Math.PI), p.il, false);
  }});
 
registerType({ id:'libre', name:'Mueble libre', icon:'✦',
  params:[
    {k:'w',l:'Ancho (mm)',v:1200,min:300,max:4000,step:50},{k:'h',l:'Alto (mm)',v:900,min:200,max:2600,step:50},
    {k:'d',l:'Fondo (mm)',v:400,min:150,max:800,step:10},{k:'m',l:'Módulos',v:2,min:1,max:8,step:1},
    {k:'sh',l:'Baldas por módulo',v:2,min:0,max:10,step:1},{k:'dr',l:'Cajones por módulo',v:0,min:0,max:6,step:1},
    {k:'dn',l:'Puertas (1 sí / 0 no)',v:1,min:0,max:1,step:1},{k:'op',l:'Sin techo (1 sí / 0 no)',v:0,min:0,max:1,step:1},
    {k:'pl',l:'Zócalo / patas (mm)',v:0,min:0,max:200,step:10}],
  build(p) {
    const f = frame(0,0,0), mw = p.w/p.m;
    for (let i = 0; i < p.m; i++)
      carcass(f, i*mw, mw, p.h, p.d, { pl:p.pl, open:p.op, dr:p.dr, dh:140, dn:p.dn ? doors(mw) : 0, sh:even(p.sh, p.pl+T, p.h-T) });
  }});
 
/* ---------- UI ---------- */
function typeButtons() {
  const box = $('types'); box.innerHTML = '';
  Object.values(TYPES).forEach(t => {
    const b = document.createElement('button');
    b.className = 'tbtn' + (t.id === cur ? ' on' : ''); b.textContent = `${t.icon||'▢'} ${t.name}`;
    b.onclick = () => setType(t.id); box.appendChild(b);
  });
}
function setType(id) {
  cur = id; P = {}; TYPES[id].params.forEach(q => P[q.k] = q.v); CM = '';
  typeButtons(); params(); rebuild(); view('iso');
}
function params() {
  const pf = $('pf'); pf.innerHTML = '';
  TYPES[cur].params.forEach(q => {
    const r = document.createElement('div'); r.className = 'fr';
    r.innerHTML = `<label class="fl">${q.l}</label><input type="number" class="ni" min="${q.min}" max="${q.max}" step="${q.step}" value="${P[q.k]}">`;
    const i = r.querySelector('input');
    i.onchange = () => {
      let v = parseFloat(i.value); if (isNaN(v)) v = q.v;
      const c = Math.min(q.max, Math.max(q.min, v));
      CM = c !== v ? `${q.l}: ajustado al rango ${q.min}–${q.max}.` : '';
      i.value = P[q.k] = c; rebuild();
    };

  });
}
function rebuild() {
  ptOff(); tc.detach(); sel = null;
  els.forEach(e => { group.remove(e.m); e.m.geometry.dispose(); }); els = [];
  TYPES[cur].build(P);
  $('warn').textContent = [CM, TYPES[cur].check ? TYPES[cur].check(P) : ''].filter(Boolean).join(' ');
  summary();
}
function summary() {
  els.forEach(e => e.m.position.copy(e.b));
  let area = 0; const g = {};
  els.forEach(e => {
    const [w,h,d] = e.s;
    if (SHEET.has(e.k)) { const a = [w,h,d].sort((x,y) => y-x); area += a[0]*a[1]/1e6; }
    const key = KN[e.k] + ' ' + [w,h,d].map(Math.round).join('×'); g[key] = (g[key]||0) + 1;
  });
  const b = new THREE.Box3().setFromObject(group), s = b.getSize(new THREE.Vector3());
  $('sum').innerHTML = els.length
    ? `<div class="kv">Piezas<b>${els.length}</b></div><div class="kv">Tablero<b>${area.toFixed(2)} m²</b></div><div class="kv">Ancho<b>${Math.round(s.x*1e3)} mm</b></div><div class="kv">Alto<b>${Math.round(s.y*1e3)} mm</b></div><div class="kv">Fondo<b>${Math.round(s.z*1e3)} mm</b></div>` : '';
  $('pl').innerHTML = Object.entries(g).map(([k,n]) => `<div><span>${n}×</span> ${k}</div>`).join('');
  summary.g = g; summary.area = area; applyView();
}
function view(v) {
  if (!els.length) return;
  const b = new THREE.Box3().setFromObject(group), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z)*1.7 + .5, o = { front:[0,.15,1], side:[1,.15,0], top:[0,1,.01], iso:[.7,.5,.9] }[v];
  camera.position.set(c.x+o[0]*r, c.y+o[1]*r, c.z+o[2]*r); orbit.target.copy(c); orbit.update();
}
 
/* ---------- Escena ---------- */
function init() {
  const box = $('cw'), w = box.clientWidth, h = box.clientHeight;
  scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3efe8); scene.fog = new THREE.Fog(0xf3efe8, 16, 34);
  camera = new THREE.PerspectiveCamera(42, w/h, .05, 80);
  renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(w, h);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; box.appendChild(renderer.domElement);
  ENV = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture; scene.environment = ENV;
  orbit = new OrbitControls(camera, renderer.domElement); orbit.enableDamping = true; orbit.addEventListener("change", () => { if (PT) PT.updateCamera(); });
  scene.add(new THREE.AmbientLight(0xffffff, .25));
  const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(6,10,5); dl.castShadow = true;
  dl.shadow.mapSize.set(4096,4096); dl.shadow.radius = 4; dl.shadow.bias = -.0004; dl.shadow.normalBias = .01; Object.assign(dl.shadow.camera, { left:-8, right:8, top:8, bottom:-8 }); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xbfd0ff, .5); dl2.position.set(-5,3,-3); scene.add(dl2);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.MeshStandardMaterial({ color:0xe9e4da, roughness:.6 }));
  fl.rotation.x = -Math.PI/2; fl.receiveShadow = true; scene.add(fl);
  const gr = GR = new THREE.GridHelper(24, 48, 0xcfc7b8, 0xddd6ca); gr.position.y = .001; scene.add(gr);
  scene.add(group);
  tc = new TransformControls(camera, renderer.domElement);
  tc.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; if (!e.value && sel && !EX) sel.b.copy(sel.m.position); }); scene.add(tc);
  renderer.domElement.addEventListener('click', e => {
    const r = renderer.domElement.getBoundingClientRect(), rc = new THREE.Raycaster();
    rc.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1), camera);
    const hit = rc.intersectObjects(els.map(x => x.m), false)[0];
    sel = hit ? els.find(x => x.m === hit.object) : null;
    sel ? tc.attach(sel.m) : tc.detach();
  });
  (function loop() {
    requestAnimationFrame(loop); orbit.update();
    if (PT) {
      if (PT.samples < 300) { PT.renderSample(); $('st').textContent = `Trazado de rayos: ${Math.floor(PT.samples)}/300 muestras`; }
      else $('st').textContent = 'Render terminado';
    } else renderer.render(scene, camera);
  })();
  window.addEventListener('resize', () => { const w = box.clientWidth, h = box.clientHeight; camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w, h); });
}
init();
Object.keys(FIN).forEach(n => { const o = document.createElement('option'); o.textContent = n; $('fin').appendChild(o); });
$('fin').onchange = e => { fin = e.target.value; rebuild(); };
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => view(b.dataset.v));
$('del').onclick = () => { if (!sel) return; tc.detach(); group.remove(sel.m); els = els.filter(x => x !== sel); sel = null; summary(); };
ready = true; setType('armario');
 
/* ---------- Vista, guardado e imagen ---------- */
function applyView() {
  els.forEach(e => e.m.position.copy(e.b));
  if (EX && els.length) {
    const bb = new THREE.Box3(); els.forEach(e => bb.expandByPoint(e.b));
    const c = bb.getCenter(new THREE.Vector3());
    els.forEach(e => e.m.position.copy(e.b).add(e.b.clone().sub(c).multiplyScalar(.6)));
  }
  els.forEach(e => e.m.visible = !(HD && (e.k === 'puerta' || e.k === 'tirador')));
}
$('tgd').onclick = () => { ptOff(); HD = !HD; $('tgd').classList.toggle('on', HD); applyView(); };
$('tge').onclick = () => { ptOff(); EX = !EX; $('tge').classList.toggle('on', EX); applyView(); };
/* Trazado de rayos real en GPU (three-gpu-pathtracer, se carga bajo demanda) */
function ptOff() {
  if (!PT) return;
  try { PT.dispose(); } catch (e) {}
  PT = null; scene.environment = ENV; GR.visible = true; $('rt').classList.remove('on'); $('st').textContent = '';
}
$('rt').onclick = async () => {
  if (PT) return ptOff();
  status('Cargando el trazador de rayos…');
  try {
    const { WebGLPathTracer } = await import('three-gpu-pathtracer');
    tc.detach(); sel = null; GR.visible = false; scene.environment = null;
    PT = new WebGLPathTracer(renderer); PT.bounces = 5; PT.tiles.set(2, 2); PT.filterGlossyFactor = .5;
    PT.setScene(scene, camera); $('rt').classList.add('on');
  } catch (e) {
    console.error(e); PT = null; GR.visible = true; scene.environment = ENV;
    status('No se pudo iniciar el trazado de rayos; se mantiene el render realista.');
  }
};
const KEY = 'crsd-project';
function status(t) { $('st').textContent = t; clearTimeout(status.t); status.t = setTimeout(() => $('st').textContent = '', 3500); }
$('save').onclick = () => { try { localStorage.setItem(KEY, JSON.stringify({ cur, P, fin })); status('Guardado solo en este navegador'); } catch (e) { status('No se pudo guardar'); } };
$('load').onclick = () => {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (!d || !TYPES[d.cur]) return status('No hay ningún diseño guardado');
    cur = d.cur; fin = FIN[d.fin] ? d.fin : 'Roble'; $('fin').value = fin; P = {};
    TYPES[cur].params.forEach(q => { const v = d.P[q.k]; P[q.k] = typeof v === 'number' ? Math.min(q.max, Math.max(q.min, v)) : q.v; });
    CM = ''; typeButtons(); params(); rebuild(); view('iso'); status('Diseño recuperado');
  } catch (e) { status('No se pudo abrir el diseño'); }
};
$('png').onclick = () => { if (!PT) renderer.render(scene, camera); const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = 'diseno-cr-muebles.png'; a.click(); };
 
/* ---------- Enviar diseño ---------- */
$('send').onclick = () => $('ms').classList.add('show');
$('cs').onclick = () => $('ms').classList.remove('show');
$('ds').onclick = () => {
